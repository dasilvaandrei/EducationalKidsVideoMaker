name: Publish nightly Short

# 4x/day, spread across kids' waking hours rather than clustered near the
# old single evening slot: 8am / 12pm / 4pm / 7pm ET. See
# publish-long-form-tuesday.yml for the full fixed-EST/DST-drift caveat,
# which applies identically here (cron is UTC-only, fixed at the EST
# offset, so actual ET times drift an hour later during EDT). 7pm EST
# crosses the UTC day boundary, so that slot fires at the *next* UTC
# day's midnight relative to the US evening; the other three don't.
#
# Each run only publishes 1 episode (--limit 1 below), so 4 runs/day =
# 4 Shorts/day — see generate-content.ts's BUFFER_TARGET_BY_AIR_SLOT,
# raised alongside this to keep the buffer from draining mid-day.
on:
  schedule:
    - cron: "0 13,17,21,0 * * *" # 8am/12pm/4pm/7pm EST (UTC 13,17,21,0)
  workflow_dispatch: {} # manual trigger, e.g. to catch up after a gap

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Publish next nightly Short to YouTube/TikTok/Instagram
        working-directory: worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Only flip to "public" once a manual run has confirmed
          # actualPrivacyStatus is actually honored for this brand-new,
          # unverified channel/OAuth app — see publish-episode.ts.
          YOUTUBE_UPLOAD_PRIVACY_STATUS: ${{ secrets.YOUTUBE_UPLOAD_PRIVACY_STATUS }}
          # TikTok/Instagram: no-ops until platform_accounts rows exist for
          # them (see README's "Cross-posting to TikTok/Instagram" section)
          # — safe to leave these secrets unset until then.
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_INSTAGRAM_USER_ID: ${{ secrets.META_INSTAGRAM_USER_ID }}
          # Optional CTA line appended to every description/caption once
          # there's something to promote (e.g. an Amazon KDP book link).
          KDP_PROMO_LINE: ${{ secrets.KDP_PROMO_LINE }}
        run: npm run publish-episode -- --air-slot nightly_short --limit 1
